name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test HelpMotivateMe.SaaS.slnx --configuration Release
      - run: docker build --tag help-motivate-me-saas:ci .
      - run: docker compose config --quiet